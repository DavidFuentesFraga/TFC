<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club de Billar Ordes</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h1>Club de Billar Ordes</h1>
    <div id="menu-links">
        <a href="/web/landingPage/index.html">Inicio</a>
        <a href="/web/shop/index.html">Tienda</a>
        <a href="/web/socios/index.html">Socios</a>
        <a href="/web/contact/index.html">Contacto</a>
    </div>
</nav>

<main>
    <div class="form-container">
        <h2>Crear cuenta</h2>
        <form id="register-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="password2">Confirmar contraseña</label>
                <input type="password" id="password2" name="password2" required>
            </div>
            <button type="submit" class="btn">Registrarse</button>
            <p class="form-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </form>
    </div>
</main>

<footer>
    <p>© 2026 Club de Billar Ordes - Todos los derechos reservados</p>
</footer>

<script src="script.js"></script>

</body>
</html>
